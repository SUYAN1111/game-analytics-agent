name: Cloud Linux acceptance (no paid API)
on:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      APP_STATE_DIR: /tmp/agent-ci
      PYTHONDONTWRITEBYTECODE: "1"
      ASSET_BUNDLE_URL: ${{ vars.ASSET_BUNDLE_URL }}
      DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:55432/postgres
      CLOUD_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements.txt uv==0.12.16
      - name: Verify deployment config integrity under JSON reformatting
        run: python scripts/check_release_integrity.py
      - run: npm ci --prefix web
      - run: uv run --no-project --python 3.14 --with pip==25.3 python scripts/build_vercel.py
      - name: Verify runtime asset archive after Vercel file exclusions
        run: python scripts/check_cloud_bundle.py
      - name: Verify isolated child interpreters
        run: python scripts/check_cloud_bootstrap.py
      - name: Verify compact indexes preserve every player's session data
        run: python scripts/check_observed_storage.py
      - run: python scripts/init_cloud_db.py
      - run: python scripts/check_cloud_http.py
      - run: python scripts/check_cloud_public.py
      - name: Verify failure reports remain available and redacted
        run: python scripts/check_cloud_diagnostics.py
      - name: Verify driver exit and cleanup failures without paid requests
        run: python scripts/check_cloud_cleanup.py
      - name: Verify five tool chains and warm reuse on a 512 MiB temporary filesystem
        run: |
          mkdir -p /tmp/cloud-runtime-tmp
          sudo mount -t tmpfs -o size=512m,mode=1777 tmpfs /tmp/cloud-runtime-tmp
          trap 'cp /tmp/cloud-runtime-tmp/state/cloud-runtime-results.json /tmp/agent-ci/cloud-runtime-results.json 2>/dev/null || true; sudo umount /tmp/cloud-runtime-tmp' EXIT
          python scripts/check_cloud_runtime.py
        env:
          CLOUD_TEST_ASSET_ARCHIVE: "1"
          CLOUD_TEST_DISK_LIMIT: "536870912"
          TMPDIR: /tmp/cloud-runtime-tmp
          APP_STATE_DIR: /tmp/cloud-runtime-tmp/state
      - run: python scripts/check_cloud_store.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-runtime-results
          path: |
            /tmp/agent-ci/cloud-bootstrap-results.json
            /tmp/agent-ci/cloud-runtime-results.json
            /tmp/agent-ci/cloud-public-results.json
            /tmp/agent-ci/cloud-bundle-results.json
            /tmp/agent-ci/cloud-cleanup-results.json
            /tmp/agent-ci/observed-storage-results.json
